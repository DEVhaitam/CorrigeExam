---
# seed_db.yml — Seed the DB on an experiment VM.
#
# Runs seed.py directly on the bare-metal node. seed.py reads testData from
# the NFS home dir (testdata_dir) and POSTs each file to the VM's API over
# the libvirt network — no need to copy test data into the VM.
#
# Required variable:
#   vm_ip — IP of the experiment VM (Terraform output)
#
# Usage:
#   ansible-playbook -i ansible/inventory/dynamic.py \
#     ansible/playbooks/seed_db.yml -e vm_ip=192.168.122.10

- name: Seed database on experiment VM
  hosts: baremetal
  gather_facts: false

  tasks:

    - name: Validate required variable
      assert:
        that: vm_ip is defined and vm_ip != ""
        fail_msg: "vm_ip must be set via -e vm_ip=<ip>"

    - name: Verify testdata_dir has 357.json
      stat:
        path: "{{ testdata_dir }}/357.json"
      register: testdata_check

    - name: Fail if testdata is missing
      fail:
        msg: >
          {{ testdata_dir }}/357.json not found on the node.
          Copy test data to the Grid5000 frontend first (once):
            scp testData/*.json access.grid5000.fr:~/testData/
      when: not testdata_check.stat.exists

    # Run seed.py 3 times on the node — each pass imports one copy of 357.json
    # into the VM's API over the libvirt NAT (http://{{ vm_ip }}:8082).
    # Three passes give the scenarios enough courses/exams/sheets to work with.
    - name: "Seed pass {{ item }}/3 — import 357.json into http://{{ vm_ip }}:8082"
      shell: |
        python3 {{ repo_root }}/workload/seed.py \
          --host http://{{ vm_ip }}:8082 \
          --datadir {{ testdata_dir }} \
          --files 357 2>&1 | grep -E "(ERROR|Import|Done|course|Traceback)" || true
      loop: [1, 2, 3]
      loop_control:
        label: "pass {{ item }}"

    - name: Seeding complete
      debug:
        msg: >
          DB seeded on {{ vm_ip }}: 3 courses, ~51 sheets, ~765 student responses.
          VM is ready for load tests.
