[defaults]
inventory          = inventory/dynamic.py
remote_user        = root
host_key_checking  = False
private_key_file   = ~/.ssh/id_rsa
stdout_callback    = yaml
timeout            = 120

# Speed up repeated playbook runs
gathering          = smart
fact_caching       = memory

[ssh_connection]
pipelining  = True
# ProxyJump is set per-host in dynamic.py (two hops: access.grid5000.fr → <site>.g5k → node).
ssh_args    = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30
