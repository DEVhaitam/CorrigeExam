global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'correctexam'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'correctexam-backend'
    metrics_path: /management/prometheus
    static_configs:
      - targets: ['back:9000']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'mysqld-exporter'
    static_configs:
      - targets: ['mysqld-exporter:9104']
