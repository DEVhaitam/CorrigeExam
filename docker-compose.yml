# ──────────────────────────────────────────────
# CorrectExam — Full Stack + Monitoring
# ──────────────────────────────────────────────
# Set DOCKERHUB_USERNAME in .env before building.
# Startup order:  mysql → minio → minio-init → back → front
#                 prometheus + grafana + node-exporter + cadvisor (independent)
# ──────────────────────────────────────────────

services:

  # ── Infrastructure ───────────────────────────

  mysql:
    image: mysql:8.0
    container_name: correctexam-mysql
    environment:
      MYSQL_DATABASE: gradeScopeIstic
      MYSQL_USER: gradescope
      MYSQL_PASSWORD: test
      MYSQL_ROOT_PASSWORD: rootpassword
    command: --lower_case_table_names=1 --skip-ssl --character_set_server=utf8mb4 --explicit_defaults_for_timestamp
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - correctexam-net
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "-prootpassword", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: correctexam-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - correctexam-net
    ports:
      - "9000:9000"
      - "9090:9090"
    command: server /data --console-address ":9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Creates the S3 bucket on first startup
  minio-init:
    image: minio/mc
    container_name: correctexam-minio-init
    networks:
      - correctexam-net
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 admin minioadmin &&
        mc mb local/test --ignore-existing &&
        echo 'Bucket ready.'
      "
    restart: on-failure

  # ── Application ──────────────────────────────

  back:
    image: ${DOCKERHUB_USERNAME:-helhayan}/correctexam-back:${IMAGE_TAG:-latest}
    build:
      context: ./corrigeExamBack
      dockerfile: Dockerfile
    container_name: correctexam-back
    environment:
      # Quarkus uses prod profile automatically when running the packaged JAR.
      # Override localhost defaults from application.properties:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:mysql://mysql:3306/gradeScopeIstic?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true"
      QUARKUS_DATASOURCE_USERNAME: gradescope
      QUARKUS_DATASOURCE_PASSWORD: test
      QUARKUS_LIQUIBASE_MIGRATE_AT_START: "true"
      QUARKUS_MINIO_HOST: minio
      QUARKUS_MINIO_PORT: "9000"
      QUARKUS_MINIO_ACCESS_KEY: admin
      QUARKUS_MINIO_SECRET_KEY: minioadmin
      QUARKUS_MINIO_SECURE: "false"
      CORRECTEXAM_BUCKETNAME: test
      CORRECTEXAM_USES3: "true"
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "8080"
      # Micrometer/Prometheus via the management interface (port 9000).
      # quarkus.management.enabled is a build-time property set in application.properties;
      # the env var below is a no-op but kept for documentation clarity.
      QUARKUS_MICROMETER_EXPORT_PROMETHEUS_ENABLED: "true"
      #QUARKUS_HTTP_LIMITS_MAX_BODY_SIZE: "256M"
    networks:
      - correctexam-net
    ports:
      - "8082:8080"    # host:container — access API at http://localhost:8082
      - "9091:9000"    # management interface — metrics at http://localhost:9091/q/metrics
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  front:
    image: ${DOCKERHUB_USERNAME:-helhayan}/correctexam-front:${IMAGE_TAG:-latest}
    build:
      context: ./corrigeExamFront
      dockerfile: Dockerfile
    container_name: correctexam-front
    networks:
      - correctexam-net
    ports:
      - "8080:80"      # host:container — access UI at http://localhost:8080
    depends_on:
      - back
    restart: unless-stopped

  # ── Monitoring ───────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: correctexam-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - correctexam-net
    ports:
      - "9092:9090"    # host:container — access at http://localhost:9092
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: correctexam-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - correctexam-net
    ports:
      - "3000:3000"    # host:container — access at http://localhost:3000
    depends_on:
      - prometheus
    restart: unless-stopped

  # MySQL metrics exporter — exposes InnoDB/query/connection metrics to Prometheus
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: correctexam-mysqld-exporter
    environment:
      DATA_SOURCE_NAME: "root:rootpassword@(mysql:3306)/"
    command:
      - "--collect.global_status"
      - "--collect.global_variables"
      - "--collect.info_schema.tables"
      - "--collect.info_schema.innodb_metrics"
      - "--collect.perf_schema.tablelocks"
      - "--collect.perf_schema.eventsstatements"
      - "--collect.perf_schema.eventsstatementssum"
      - "--collect.slave_status"
    networks:
      - correctexam-net
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # System-level metrics — runs without host bind-mounts (compatible with Docker Desktop on macOS)
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: correctexam-node-exporter
    networks:
      - correctexam-net
    restart: unless-stopped

  # Per-container resource metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: correctexam-cadvisor
    privileged: true
    networks:
      - correctexam-net
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

networks:
  correctexam-net:
    driver: bridge

volumes:
  mysql_data:
  minio_data:
  prometheus_data:
  grafana_data:
