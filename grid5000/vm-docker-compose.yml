# vm-docker-compose.yml — App stack for experiment VMs (Grid5000).
#
# Differences vs. the local docker-compose.yml:
#   - NO Prometheus or Grafana (monitoring runs on the bare-metal node)
#   - node-exporter uses full Linux host bind-mounts for accurate system metrics
#   - cadvisor uses privileged mode (works on Linux without restrictions)
#   - Port 9000 (management/metrics) on the backend is exposed on 9000 (not 9091)
#     so Prometheus on the node can scrape it directly at <vm-ip>:9000
#
# Copied to the VM by deploy_app.sh at /opt/correctexam/docker-compose.yml

services:

  mysql:
    image: mysql:8.0
    container_name: correctexam-mysql
    environment:
      MYSQL_DATABASE: gradeScopeIstic
      MYSQL_USER: gradescope
      MYSQL_PASSWORD: test
      MYSQL_ROOT_PASSWORD: rootpassword
    command: --lower_case_table_names=1 --skip-ssl --character_set_server=utf8mb4 --explicit_defaults_for_timestamp
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - correctexam-net
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "-prootpassword", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: correctexam-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - correctexam-net
    ports:
      - "9000:9000"
      - "9090:9090"
    command: server /data --console-address ":9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc
    container_name: correctexam-minio-init
    networks:
      - correctexam-net
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 admin minioadmin &&
        mc mb local/test --ignore-existing &&
        echo 'Bucket ready.'
      "
    restart: on-failure

  back:
    image: ${DOCKERHUB_USERNAME:-helhayan}/correctexam-back:${IMAGE_TAG:-latest}
    container_name: correctexam-back
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:mysql://mysql:3306/gradeScopeIstic?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true"
      QUARKUS_DATASOURCE_USERNAME: gradescope
      QUARKUS_DATASOURCE_PASSWORD: test
      QUARKUS_LIQUIBASE_MIGRATE_AT_START: "true"
      QUARKUS_MINIO_HOST: minio
      QUARKUS_MINIO_PORT: "9000"
      QUARKUS_MINIO_ACCESS_KEY: admin
      QUARKUS_MINIO_SECRET_KEY: minioadmin
      QUARKUS_MINIO_SECURE: "false"
      CORRECTEXAM_BUCKETNAME: test
      CORRECTEXAM_USES3: "true"
      QUARKUS_HTTP_HOST: "0.0.0.0"
      QUARKUS_HTTP_PORT: "8080"
      QUARKUS_MICROMETER_EXPORT_PROMETHEUS_ENABLED: "true"
      QUARKUS_HTTP_LIMITS_MAX_BODY_SIZE: "256M"
    networks:
      - correctexam-net
    ports:
      - "8082:8080"    # API — Locust targets this
      - "9091:9000"    # management/metrics — Prometheus on node scrapes this at :9091
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  front:
    image: ${DOCKERHUB_USERNAME:-helhayan}/correctexam-front:${IMAGE_TAG:-latest}
    container_name: correctexam-front
    networks:
      - correctexam-net
    ports:
      - "8080:80"
    depends_on:
      - back
    restart: unless-stopped

  # ── Monitoring exporters (scraped by Prometheus on the bare-metal node) ──

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: correctexam-mysqld-exporter
    environment:
      DATA_SOURCE_NAME: "root:rootpassword@(mysql:3306)/"
    command:
      - "--collect.global_status"
      - "--collect.global_variables"
      - "--collect.info_schema.tables"
      - "--collect.info_schema.innodb_metrics"
      - "--collect.perf_schema.tablelocks"
      - "--collect.perf_schema.eventsstatements"
      - "--collect.perf_schema.eventsstatementssum"
    networks:
      - correctexam-net
    ports:
      - "9104:9104"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Full Linux bind-mounts — accurate VM system metrics (CPU, RAM, disk, network)
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: correctexam-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    ports:
      - "9100:9100"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: correctexam-cadvisor
    privileged: true
    ports:
      - "8081:8080"    # 8081 on host to avoid clash with front (:8080)
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

networks:
  correctexam-net:
    driver: bridge

volumes:
  mysql_data:
  minio_data:
