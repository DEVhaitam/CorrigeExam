# experiments.yml — VM configuration matrix for Stage 1 provisioning experiments.
#
# Two phases:
#   Phase 1 (RAM sweep)  — fix vCPUs=2, vary RAM to find the RAM saturation point.
#   Phase 2 (CPU sweep)  — fix RAM=4GB,  vary vCPUs to observe CPU scaling.
#
# Run order matters: start with Phase 1 (cheaper, hits saturation earlier).
# Each experiment runs s03_mixed at load steps [10, 25, 50, 100, 200, 500, 1000, 2000, 4000]
# users × 5 min, stopping at the first step where failure_rate > 5% or p95 > 30s.
#
# Time budget (worst-case, no early stopping):
#   ~101 min per experiment (provision + deploy + seed + 9 steps × 10 min + cleanup)
#   Phase 1 only (5 configs)  → ~505 min → reserve 9 hours
#   Full matrix  (8 configs)  → ~810 min → reserve 14 hours
#   (Most constrained configs saturate at step 2–4 → actual time is much lower)
#   18-hour Grid5000 reservation comfortably covers the full matrix.
#
# 10-minute steps: the first ~30 s of each step is JVM JIT warm-up noise.
# 10 min gives ~9.5 min of steady-state data, making warm-up negligible.
#
# NOTE: ramp_rate=50 is required so the 4000-user step reaches full load within 80 s
# (4000 / 50 = 80 s ramp), leaving ~8.5 min of steady state within the 10-min window.

load_steps:
  users:    [10, 25, 50, 100, 200, 500, 1000, 2000, 4000]
  duration: "10m"
  ramp_rate: 50           # users spawned per second (increased to handle 4 000-user steps)
  saturation:
    failure_rate_pct: 5   # stop if failure % exceeds this
    p95_ms: 30000         # stop if p95 latency (ms) exceeds this

experiments:

  # ── Phase 1: RAM sweep (2 vCPUs, vary RAM) ─────────────────────────────────
  # Goal: find minimum viable RAM and observe JVM OOM / swap / GC pressure.
  # NOTE: 2cpu-512mb and 2cpu-1gb were tested and definitively failed — the Linux
  # OOM killer terminates MySQL before InnoDB initialisation completes. They are
  # excluded from the run matrix; the minimum viable floor is documented as > 1 GB.

  - label: "2cpu-2gb"
    phase: 1
    vcpus: 2
    ram_mb: 2048
    disk_gb: 20

  - label: "2cpu-4gb"
    phase: 1
    vcpus: 2
    ram_mb: 4096
    disk_gb: 20

  - label: "2cpu-8gb"
    phase: 1
    vcpus: 2
    ram_mb: 8192
    disk_gb: 20

  # ── Phase 2: CPU sweep (4 GB RAM, vary vCPUs) ──────────────────────────────
  # Goal: observe CPU scaling — does doubling vCPUs double throughput?
  # 2cpu-4gb already run in Phase 1, serves as the control point for this phase.

  - label: "1cpu-4gb"
    phase: 2
    vcpus: 1
    ram_mb: 4096
    disk_gb: 20

  - label: "4cpu-4gb"
    phase: 2
    vcpus: 4
    ram_mb: 4096
    disk_gb: 20

  - label: "8cpu-4gb"
    phase: 2
    vcpus: 8
    ram_mb: 4096
    disk_gb: 20
